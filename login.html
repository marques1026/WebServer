<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="login-container">
        
        <section class="login-acesso">
            <img src="./assets/Logo_Cinema.svg" alt="Logo da plataforma de cinema" class="logo">
            <h1>A plataforma de filmes número 1!</h1>
        </section>

        <section class="login-de-acesso">
            <h2>Login</h2>
            <p>Preencha os campos abaixo com o seus dados para acessar</p>
            
            <form>
                <div class="email-acesso">
                    <label for="usuario">Usuario</label>
                    <input id="usuario" type="email" placeholder="Digite seu e-mail"/>
                </div>

                <div class="senha-acesso">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" placeholder="Digite sua senha"/>
                </div>
                
                <div class="entrar">
                    <button type="submit">Entrar</button>
                </div>
            </form>

            <a href="./cadastro.html">Esqueceu a senha?</a>
        </section>
        
    </main>
</body>
</html>
