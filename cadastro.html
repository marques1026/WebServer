<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Filmes</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main class="container-cadastro">
        <section class="formulario-cadastro">
            <form>
                <h1>Cadastro de filmes</h1>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="filme-nome">Nome do filme</label>
                        <input id="filme-nome" type="text" placeholder="Digite o nome do filme" />
                    </div>
                    <div class="campo-formulario">
                        <label for="filme-atores">Atores</label>
                        <input id="filme-atores" type="text" placeholder="Digite os atores" />
                    </div>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="filme-diretor">Diretor</label>
                        <input id="filme-diretor" type="text" placeholder="Digite o diretor" />
                    </div>
                    <div class="campo-formulario">
                        <label for="filme-ano">Ano</label>
                        <input id="filme-ano" type="number" placeholder="Digite o ano de lançamento" />
                    </div>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="filme-genero">Gênero</label>
                        <input id="filme-genero" type="text" placeholder="Digite o gênero" />
                    </div>
                    <div class="campo-formulario">
                        <label for="filme-produtora">Produtora</label>
                        <input id="filme-produtora" type="text" placeholder="Digite a Produtora" />
                    </div>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="filme-sinopse">Sinopse</label>
                        <textarea id="filme-sinopse" placeholder="Digite a sinopse"></textarea>
                    </div>
                </div>

                <button type="submit" class="botao-cadastrar">Cadastrar</button>
            </form>
        </section>
    </main>
</body>

</html>
